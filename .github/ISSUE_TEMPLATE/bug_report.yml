name: Bug report
description: Report a reproducible problem with SpecVibe
title: 'bug: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.

        Do **not** include secrets, private repository content, or full `.env` files.
        For security vulnerabilities, follow SECURITY.md instead of opening a public issue.

  - type: input
    id: version
    attributes:
      label: SpecVibe version
      description: Output of `specvibe version`.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.12.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agent integration
      description: Which host was involved, if any?
      options:
        - None / CLI only
        - OpenCode
        - Claude Code
        - Cursor
        - Gemini CLI
        - Windsurf / Devin
        - GitHub Copilot
        - Generic AGENTS.md
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and flags
      description: The exact command you ran, with private paths redacted.
      render: shell
      placeholder: specvibe apply my-track --done T1 --json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exit code and error code if available.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal sequence, repository shape, or fixture that triggers the problem.
      placeholder: |
        1. Run `specvibe init --agents generic`
        2. Run `specvibe propose "Test feature"`
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste output with secrets removed. `specvibe doctor --json` is often useful.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and private repository content from this report.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
