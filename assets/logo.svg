<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SpecVibe logo</title>
  <desc id="desc">A shield with a check mark and a spark, representing guarded spec-driven work for AI coding agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#123447"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <path d="M256 84 402 140v102c0 88-58 150-146 186-88-36-146-98-146-186V140L256 84Z"
        fill="none" stroke="url(#accent)" stroke-width="18" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="m196 258 42 42 84-96" fill="none" stroke="#e6fffb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M356 92v44M334 114h44" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
  <circle cx="164" cy="130" r="9" fill="#38bdf8"/>
</svg>
